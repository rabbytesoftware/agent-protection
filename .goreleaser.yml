version: 2
builds:
  - id: ap
    main: ./cmd/ap
    binary: ap
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - id: ap
    name_template: 'ap_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
dockers:
  - image_templates:
      - "ghcr.io/rabbytesoftware/agent-protection:{{ .Tag }}"
      - "ghcr.io/rabbytesoftware/agent-protection:latest"
    dockerfile: Dockerfile
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
changelog:
  use: github-native
release:
  github:
    owner: rabbytesoftware
    name: agent-protection
