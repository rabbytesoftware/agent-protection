name: CI

on:
  pull_request:
    branches: [master]

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: go build -o bin/ap ./cmd/ap
      - name: ap checks itself (dogfooding)
        run: ./bin/ap check .
      - run: go test ./...
