name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump from the merged PR's branch prefix and labels
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0]')
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No PR found for ${{ github.sha }}; nothing to release."
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_REF=$(jq -r '.head.ref' <<< "$PR")
          case "${HEAD_REF%%/*}" in
            feature|enhancement) BUMP="minor" ;;
            fix|hotfix) BUMP="patch" ;;
            *) BUMP="none" ;;
          esac
          if jq -e '.labels[] | select(.name == "breaking-change")' <<< "$PR" > /dev/null; then
            BUMP="major"
          fi
          echo "PR #$(jq -r '.number' <<< "$PR") from $HEAD_REF: $BUMP"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Tag the next version
        id: tag
        if: steps.bump.outputs.bump != 'none'
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          NEXT=$(./scripts/semver-next.sh "$LATEST" "${{ steps.bump.outputs.bump }}")
          git tag "$NEXT"
          git push origin "$NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
